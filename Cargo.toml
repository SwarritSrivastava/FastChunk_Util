[package]
name = "fastchunk"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive", "help", "usage"] }
zstd = { version = "0.13", features = ["zstdmt"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
parse-size = "1.1"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.10"
